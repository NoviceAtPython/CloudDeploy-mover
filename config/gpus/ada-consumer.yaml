# Consumer GeForce Ada (RTX 40-series).
#
# Replaces / generalises config/gpus/rtx4090.yaml. Works on both
# the closed and the open NVIDIA kernel module families. v2 deploys
# validated with the closed module on driver 580; we keep that as
# the default but the selector preserves an installed open driver
# if it works.

match:
  pci_ids:
    - "10de:2684"  # RTX 4090
    - "10de:2685"  # RTX 4090 D
    - "10de:2705"  # RTX 4070 Ti SUPER
    - "10de:2782"  # RTX 4070 Ti
    - "10de:2786"  # RTX 4070
  name_patterns:
    - "GeForce RTX 4090"
    - "GeForce RTX 40"

nvidia:
  prefer_open_family: false
  driver_major_min: "535"
  notes:
    - "AD102 / AD103 / AD104 work with closed and open kernel modules."
    - "If server-open is already installed and nvidia-smi works, the"
    - "selector keeps it (does not uninstall)."

streaming:
  av1_encode: yes
  hdr: yes
