# sdr-1440p144 - high-refresh SDR at 1440p.
#
# 2560x1440 @ 144 Hz, AV1/HEVC NVENC, 8-bit SDR. The sweet spot for 144 Hz
# 1440p monitors: more refresh than 120 while staying inside what a forced
# EDID can express (1440p240 ~985 MHz exceeds the EDID detailed-timing limit
# and is not advertisable without DisplayPort DSC).
#
# NOTE: requires a 144 Hz client; not validatable without one.

profile: sdr-1440p144
ubuntu_version: "25.10"

display:
  resolution: 2560x1440
  refresh: 144
  hdr: false
  forced_connector: DP-1

nvidia:
  driver_major: "595"
  prefer_open_family: true
  prefer_server: false

cuda:
  mode: none

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 8f02b1ce455ce4e7efa1b4031bb23764f2809cdb
  encoder: nvenc
  capture: kms
  force_av1_hdr10: false
  synthesize_hdr10_metadata: false

kwin:
  patched_hdr: false

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
