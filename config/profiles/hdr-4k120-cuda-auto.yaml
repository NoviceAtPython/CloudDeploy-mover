# hdr-4k120-cuda-auto - HDR streaming + CUDA attempted, OS AND CUDA
# repo chosen by the resolvers.
#
# Composition of two resolvers:
#   - Deploy.ubuntu_* selects the newest v3-supported Ubuntu release.
#   - CUDA.cuda_repo_distro_candidates selects the newest reachable
#     NVIDIA CUDA apt repo distro (honoring cross-distro repo use
#     when allowed). v2 demonstrated CUDA 13 installs via NVIDIA's
#     ubuntu2404 repo even on a 25.10 host.
#
# Use this profile when you want CUDA but do NOT want to pin the
# Ubuntu version. The strict CUDA-13 vs. CUDA-12 trade-off is also
# resolved automatically: latest-compatible + prefer_major=13 picks
# CUDA 13 when reachable, falls through to lower majors / Ubuntu
# archive as a LAST resort.

profile: hdr-4k120-cuda-auto
ubuntu_version: ""

display:
  resolution: 3840x2160
  refresh: 120
  hdr: true
  forced_connector: DP-1

nvidia:
  driver_major: "580"
  prefer_open_family: true
  prefer_server: false

cuda:
  # Auto deploys attempt CUDA for Sunshine build/perf diagnostics, but
  # the KMS+NVENC gaming path must not be blocked forever by a toolkit
  # smoke-test hang. Strict CUDA profiles keep cuda.mode=required.
  mode: optional
  method: apt
  selection_policy: latest-compatible
  prefer_major: "13"
  prefer_newest: true
  min_major: "12"
  allow_cross_distro_cuda_repo: true
  cuda_repo_distro_candidates:
    - auto-host
    - ubuntu2404
  allow_ubuntu_archive_fallback: true
  compile_smoke_test: true
  package_name: ""
  runfile_url: ""
  runfile_sha256: ""
  runfile_max_attempts: 3

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 464bccf1b6e33bf35138136c6138fd9851e6d906
  encoder: nvenc
  capture: kms
  hevc_mode: 3
  av1_mode: 3
  force_av1_hdr10: true
  synthesize_hdr10_metadata: true

kwin:
  patched_hdr: true
  patch: patches/kwin-clouddeploy-nvidia-private-hdr.patch

desktop:
  # Live-VM-validated Milestone-4 path (2026-05-21):
  #   - real-VT logind session (the v2-parity ingredient that makes
  #     logind hand DRM master to the compositor).
  #   - DIRECT kwin_wayland (NOT startplasma-wayland). On the live VM
  #     Plasma's startplasma-wayland exited with status=4 even after
  #     the patched KWin built cleanly, while direct kwin_wayland
  #     came up with DP-1 3840x2160@120 + HDR + WCG.
  session_backend: realvt
  compositor_mode: kwin
  # enable_linger defaults to true; pinning here for documentation.
  enable_linger: true

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false

  ubuntu_selection_policy: latest-compatible
  ubuntu_candidates:
    - "26.04"
    - "25.10"
    - "24.04"
  prefer_lts: false
