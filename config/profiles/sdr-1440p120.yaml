# sdr-1440p120 - high-refresh SDR at 1440p.
#
# 2560x1440 @ 120 Hz, AV1/HEVC NVENC, 8-bit SDR. Same SDR stack as
# sdr-1080p120 (stock KWin, no HDR knobs) at the 1440p sweet spot for
# clients without an HDR display that still want the extra sharpness.
#
# The universal SDR EDID advertises 1440p120 as a CVT-reduced-blanking
# detailed timing (2560x1440 has no CTA VIC).

profile: sdr-1440p120
ubuntu_version: "25.10"

display:
  resolution: 2560x1440
  refresh: 120
  hdr: false
  forced_connector: DP-1

nvidia:
  driver_major: "595"
  prefer_open_family: true
  prefer_server: false

cuda:
  mode: none

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 8f02b1ce455ce4e7efa1b4031bb23764f2809cdb
  encoder: nvenc
  capture: kms
  force_av1_hdr10: false
  synthesize_hdr10_metadata: false

kwin:
  patched_hdr: false

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
