# hdr-4k120 - intended final HDR state.
#
# This profile describes the END STATE the deploy targets:
#   3840x2160 @ 120 Hz, AV1 NVENC, 10-bit, HDR.
#
# v3 is NOT yet able to reach this state end-to-end. See
# docs/V2-V3-PARITY.md for the exact gap. The currently-implemented
# phases (ubuntu-upgrade, base-packages, nvidia-driver, cuda, edid)
# are real; KDE / KWin / Sunshine / Tailscale / PipeWire / streaming
# + HDR validation remain on the v2 path:
#
#     sudo ENABLE_HDR=1 bash ./CloudDeploy-wayland.sh
#
# v2 is the validated end-to-end path. See
# docs/final-hdr-success/KNOWN_GOOD_SUNSHINE_STATE.md for the
# state-of-record this profile reaches once v3 catches up.

profile: hdr-4k120
ubuntu_version: "25.10"

display:
  resolution: 3840x2160
  refresh: 120
  hdr: true
  forced_connector: DP-1

nvidia:
  driver_major: "580"
  # The HDR-4K120 path is validated on RTX 4090 (closed module fine)
  # and RTX 5090 (Blackwell consumer, requires open). Setting
  # prefer_open_family=true is the safe default for both; the
  # internal/nvidia selector still treats a working installed-server
  # driver on RTX 4090 as "keep it" rather than uninstalling.
  prefer_open_family: true
  prefer_server: false

cuda:
  # KMS + NVENC + AV1 HDR streaming does not need the CUDA toolkit.
  # Set to "optional" only if a downstream profile derives from this
  # one and explicitly needs CUDA (e.g. ML workloads on top of the
  # gaming VM).
  mode: none

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: ec7f60fb8a31042fe03a638bdafcdb3bfe096b87
  encoder: nvenc
  capture: kms
  hevc_mode: 3
  av1_mode: 3
  # The two knobs that flip Moonlight's HDR overlay on:
  force_av1_hdr10: true
  synthesize_hdr10_metadata: true

kwin:
  patched_hdr: true
  patch: patches/kwin-clouddeploy-nvidia-private-hdr.patch

# deploy: opts the v3 ubuntu-upgrade phase into reconciling the host
# from a fresh Ubuntu 24.04 cloud image to the profile's target 25.10
# via the same direct apt-source codename rewrite v2 uses (because
# `do-release-upgrade -d` refuses the 24.04 -> 25.10 hop).
#
#   auto_upgrade_ubuntu       enable the ubuntu-upgrade phase at all
#   accept_non_lts            unlock non-LTS targets (25.10 is non-LTS)
#   direct_apt_codename_upgrade  auto/force/off; auto picks direct
#                                rewrite for known-failing hops
#   auto_reboot               false = operator SSHes back in and runs
#                             `sudo clouddeployctl resume` manually
#                             after each reboot (safer default on a
#                             cloud VM than letting the orchestrator
#                             reboot itself unattended)
deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
