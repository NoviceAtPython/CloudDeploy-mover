# sdr-1080p120 - mainstream high-refresh SDR.
#
# 1920x1080 @ 120 Hz, AV1/HEVC NVENC, 8-bit SDR. No HDR anywhere in the
# stack: stock KWin (no patched-HDR build), no force_av1_hdr10, no HDR
# static-metadata synthesis. This is the recommended default for clients
# WITHOUT an HDR display and for the lowest-friction high-FPS stream.
#
# Still uses the CloudDeploy Sunshine fork for the KMS/Wayland/NVENC
# capture path; the universal SDR EDID advertises 1080p120 via CTA VIC 63.

profile: sdr-1080p120
ubuntu_version: "25.10"

display:
  resolution: 1920x1080
  refresh: 120
  hdr: false
  forced_connector: DP-1

nvidia:
  driver_major: "595"
  prefer_open_family: true
  prefer_server: false

cuda:
  mode: none

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 8f02b1ce455ce4e7efa1b4031bb23764f2809cdb
  encoder: nvenc
  capture: kms
  force_av1_hdr10: false
  synthesize_hdr10_metadata: false

kwin:
  # SDR needs no patched KWin; stock KWin Wayland drives the output.
  patched_hdr: false

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
