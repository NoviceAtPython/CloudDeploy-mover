# hdr-4k120-cuda - hdr-4k120 + CUDA toolkit required, pinned to
# Ubuntu 25.10.
#
# This profile is identical to hdr-4k120 except cuda.mode=required:
# the v3 cuda phase will install the toolkit (NVIDIA apt repo when
# available, toolkit-only NVIDIA runfile otherwise), verify nvcc,
# and fail the deploy if it cannot.
#
# Use this profile for end-to-end testing of the v3 CUDA path on a
# fresh cloud VM. The streaming side does NOT depend on the toolkit
# - HDR over KMS+NVENC works without CUDA - but downstream profiles
# that derive from this one (ML workloads on top of the gaming VM)
# need a working nvcc.
#
# Ubuntu 25.10 strategy (cross-distro NVIDIA CUDA repo)
# -----------------------------------------------------
# NVIDIA does NOT publish an ubuntu2510 CUDA apt repo (as of 2026-05).
# v2 demonstrated that CUDA 13 installs cleanly on 25.10 by using the
# NVIDIA ubuntu2404 CUDA repo as a cross-distro fallback. v3 follows
# the same approach via the cuda_repo_distro_candidates ladder
# below. The strict policy still refuses Ubuntu's CUDA 12 archive
# and the unversioned cuda-toolkit metapackage.
#
# If for some reason ubuntu2404 also becomes unreachable AND no
# known-good CUDA 13 runfile is pinned, this profile will fail loudly
# with a "no reachable NVIDIA CUDA apt repo" message rather than
# silently downgrading to CUDA 12 - that is the strict contract.
# Use `hdr-4k120-cuda-compatible` if you need a profile that allows
# the archive fallback.
#
# The CUDA 13.0.2 toolkit-only runfile is still reproducibly corrupt
# on NVIDIA's production mirror; the runfile_url stays empty until a
# known-good (URL, sha256) pair is captured.

profile: hdr-4k120-cuda
ubuntu_version: "25.10"

display:
  resolution: 3840x2160
  refresh: 120
  hdr: true
  forced_connector: DP-1

nvidia:
  driver_major: "580"
  prefer_open_family: true
  prefer_server: false

cuda:
  # Strict CUDA-13-only profile. Refuses Ubuntu's CUDA 12.x archive,
  # the metapackage (which tracks "latest" and may slip to 14.x in
  # the future), and any runfile whose URL points at a non-CUDA-13
  # release. Pair with `hdr-4k120-cuda-compatible` if you need a
  # broader-compat variant that accepts CUDA 12 or NVIDIA's "latest"
  # metapackage.
  mode: required
  method: apt
  selection_policy: exact-major
  expected_major: "13"
  allow_ubuntu_archive_fallback: false
  compile_smoke_test: true
  package_name: ""

  # Cross-distro NVIDIA CUDA repo ladder. v2 demonstrated CUDA 13
  # works on Ubuntu 25.10 by installing from NVIDIA's ubuntu2404
  # CUDA repo even when no ubuntu2510 repo exists yet. v3 follows
  # the same trick:
  #   - auto-host: ubuntu2510 on 25.10, ubuntu2404 on 24.04
  #   - ubuntu2404: the known-good cross-distro fallback today
  allow_cross_distro_cuda_repo: true
  cuda_repo_distro_candidates:
    - auto-host
    - ubuntu2404
  # runfile_url: intentionally unset (see KNOWN GAP block above for
  # the 13.0.2-corruption story). When a known-good CUDA 13 runfile
  # is captured, set BOTH runfile_url and runfile_sha256 and switch
  # method back to "auto"; the strict policy will still refuse to
  # install anything outside CUDA 13.
  runfile_url: ""
  runfile_sha256: ""
  runfile_max_attempts: 3

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 8f02b1ce455ce4e7efa1b4031bb23764f2809cdb
  encoder: nvenc
  capture: kms
  hevc_mode: 3
  av1_mode: 3
  force_av1_hdr10: true
  synthesize_hdr10_metadata: true

kwin:
  patched_hdr: true
  patch: patches/kwin-clouddeploy-nvidia-private-hdr.patch

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
