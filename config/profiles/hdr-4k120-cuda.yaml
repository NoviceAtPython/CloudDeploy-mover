# hdr-4k120-cuda - hdr-4k120 + CUDA toolkit required.
#
# This profile is identical to hdr-4k120 except cuda.mode=required:
# the v3 cuda phase will install the toolkit (NVIDIA apt repo when
# available, toolkit-only NVIDIA runfile otherwise), verify nvcc,
# and fail the deploy if it cannot.
#
# Use this profile for end-to-end testing of the v3 CUDA path on a
# fresh cloud VM. The streaming side does NOT depend on the toolkit
# - HDR over KMS+NVENC works without CUDA - but downstream profiles
# that derive from this one (ML workloads on top of the gaming VM)
# need a working nvcc.

profile: hdr-4k120-cuda
ubuntu_version: "25.10"

display:
  resolution: 3840x2160
  refresh: 120
  hdr: true
  forced_connector: DP-1

nvidia:
  driver_major: "580"
  prefer_open_family: true
  prefer_server: false

cuda:
  # required: phase fails the deploy if it cannot install + verify
  # nvcc. Use mode=optional if you want the deploy to continue when
  # the official CUDA apt repo is unavailable for this Ubuntu version
  # and the runfile mirror is intermittently corrupting downloads.
  mode: required
  package_name: ""
  # apt: bootstrap the official NVIDIA CUDA apt repository
  # (cuda-keyring_1.1-1) and install a `cuda-toolkit-13-N` package
  # toolkit-only. This is the v3 default while no known-good CUDA 13
  # runfile is pinned (see below).
  method: apt
  # runfile_url: intentionally unset.
  #
  # The CUDA 13.0.2 toolkit-only runfile
  #   https://developer.download.nvidia.com/compute/cuda/13.0.2/local_installers/cuda_13.0.2_580.95.05_linux.run
  # is reproducibly corrupt on the production mirror as of this commit:
  #   size  : 4328066903
  #   sha256: 81a5d0d0870ba2022efb0a531dcc60adbdc2bbff7b3ef19d6fd6d8105406c775
  #   --check (NVIDIA's embedded MD5 vs the runfile body):
  #           "different from a7389036e857482d4465dc2d5b6370d8"
  # v3's runfile path correctly refuses to install it and v3's
  # RetryDecider refuses to redownload the same bad SHA. Until a
  # known-good CUDA 13 runfile passes `--check` AND its sha256 is
  # captured into runfile_sha256 below, we deliberately leave the URL
  # empty so the cuda phase ONLY uses apt for this profile.
  #
  # To re-enable the runfile fallback after capturing a good artifact:
  #   1. Download the candidate runfile.
  #   2. Confirm `sh cuda_*_linux.run --check` exits 0.
  #   3. Capture sha256 and set BOTH fields below; switch method back
  #      to `auto`.
  runfile_url: ""
  runfile_sha256: ""
  runfile_max_attempts: 3

sunshine:
  source: fork
  fork_repo: https://github.com/NoviceAtPython/Sunshine
  fork_branch: codex/sunshine-pairing-diagnostics
  fork_commit: 464bccf1b6e33bf35138136c6138fd9851e6d906
  encoder: nvenc
  capture: kms
  force_av1_hdr10: true
  synthesize_hdr10_metadata: true

kwin:
  patched_hdr: true
  patch: patches/kwin-clouddeploy-nvidia-private-hdr.patch

deploy:
  auto_upgrade_ubuntu: true
  accept_non_lts: true
  direct_apt_codename_upgrade: auto
  auto_reboot: false
